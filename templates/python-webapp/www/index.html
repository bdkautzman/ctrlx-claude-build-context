<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Template App</title>
  <!-- Relative URLs only: the page is served below /<snap-name>/ by the ctrlX reverse proxy.
       kit.css / kit.js: the kit's shared UI parts (don't edit them in an app); style.css / app.js: this app. -->
  <link rel="stylesheet" href="kit.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:,">
</head>
<!-- data-ui-ready: app.js sets "true" once the data is shown; tools/ui_check.py waits for it -->
<body data-ui-ready="false">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1 id="app-title">Template App</h1>
      <span id="app-version" class="muted"></span>
    </div>
    <div class="topbar-right">
      <!-- only shown to users who may not do everything ("View only", "Operator") -->
      <span id="role" class="pill pill-role" hidden></span>
      <span id="conn" class="pill pill-unknown" title="Data Layer connection">Data Layer: …</span>
      <!-- data-role="configure": only users who may change settings see it (kit.js) -->
      <button type="button" id="btn-settings" class="btn btn-small btn-with-icon" data-role="configure" hidden
              title="Settings" aria-label="Settings" aria-controls="drawer" aria-expanded="false"><svg class="ic"><use href="#i-sliders"/></svg><span class="btn-label">Settings</span></button>
      <!-- light / dark for this browser, every role (kit.js sets the icon, title and aria-pressed) -->
      <button type="button" id="btn-theme" class="btn btn-small btn-theme" title="Switch to dark mode"
              aria-label="Dark mode" aria-pressed="false"><svg class="ic"><use href="#i-moon"/></svg></button>
      <div class="menu-wrap">
        <button type="button" id="btn-help" class="btn btn-small btn-help" title="Help" aria-label="Help"
                aria-haspopup="menu" aria-expanded="false" aria-controls="help-menu"><svg class="ic"><use href="#i-help"/></svg></button>
        <div id="help-menu" class="menu" role="menu" aria-label="Help" hidden>
          <a role="menuitem" id="help-page" href="https://example.com" target="_blank" rel="noopener noreferrer"><svg class="ic"><use href="#i-external"/></svg>App page</a>
          <button type="button" role="menuitem" id="btn-tutorial"><svg class="ic"><use href="#i-play"/></svg>Tutorial</button>
          <!-- About: name, version, author, license, AI note from GET /status (kit.js builds the dialog) -->
          <button type="button" role="menuitem" id="btn-about"><svg class="ic"><use href="#i-info"/></svg>About</button>
        </div>
      </div>
    </div>
  </header>

  <!-- pages: tabs under the top bar (kit.js Kit.setupTabs). The hash names the page (#overview, #values); a tab with
       data-role="operate|configure" is only for that role. A one-page app: remove this nav and the .page wrappers. -->
  <nav class="tabs" id="tabs" aria-label="Pages">
    <a href="#overview">Overview</a>
    <a href="#values">Data Layer</a>
  </nav>

  <div id="banner" class="banner" hidden></div>

  <main>
  <div class="page grid" data-page="overview">
    <section class="card" id="status-card" aria-labelledby="status-h">
      <h2 id="status-h">Status</h2>
      <dl class="kv" id="status-list">
        <dt>Uptime</dt><dd id="st-uptime">–</dd>
        <dt>Settings source</dt><dd id="st-source">–</dd>
        <dt>Settings persisted</dt><dd id="st-persisted">–</dd>
        <dt>Data Layer nodes</dt><dd id="st-nodes">–</dd>
      </dl>
      <p id="st-error" class="error" hidden></p>
    </section>
  </div>

  <div class="page grid" data-page="values" hidden>
    <section class="card" id="values-card" aria-labelledby="values-h">
      <h2 id="values-h">Data Layer values</h2>
      <table class="values">
        <thead><tr><th>Address</th><th>Type</th><th>Value</th><th></th></tr></thead>
        <tbody id="values-body"><tr><td colspan="4" class="muted">Loading…</td></tr></tbody>
      </table>
    </section>
  </div>
  </main>

  <!-- settings: slide in from the right; only for the configure role (kit.js Kit.setupSettings) -->
  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
  <aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="settings-h" aria-hidden="true" inert>
    <div class="card-head drawer-head">
      <h2 id="settings-h">Settings</h2>
      <button type="button" id="btn-close-settings" class="tool tool-bare" title="Close" aria-label="Close settings"><svg class="ic"><use href="#i-close"/></svg></button>
    </div>
    <p class="muted drawer-note">Stored in ctrlX app data · saved and loaded with configurations</p>
    <form id="settings-form" novalidate>
      <div id="settings-fields" class="fields"><p class="muted">Loading…</p></div>
      <ul id="settings-errors" class="error-list" hidden></ul>
      <div class="actions">
        <button type="submit" id="btn-save" class="btn btn-primary">Save</button>
        <button type="button" id="btn-revert" class="btn">Revert</button>
        <button type="button" id="btn-defaults" class="btn btn-ghost">Reset to defaults</button>
        <span id="save-state" class="muted" aria-live="polite"></span>
      </div>
    </form>
  </aside>

  <script src="kit.js"></script>
  <script src="app.js"></script>
</body>
</html>
