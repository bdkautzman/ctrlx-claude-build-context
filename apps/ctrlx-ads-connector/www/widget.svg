<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160">
  <!-- picture of the widget in the ctrlX home screen's widget list (manifest uiExtensions.dashboard[].image) -->
  <rect x="1" y="1" width="238" height="158" rx="8" fill="#ffffff" stroke="#e1e4e8" stroke-width="2"/>
  <text x="14" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f2328">TwinCAT controllers</text>
  <rect x="128" y="16" width="62" height="20" rx="10" fill="none" stroke="#7fc3a4"/>
  <text x="159" y="30" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#00884a" text-anchor="middle">all running</text>
  <rect x="196" y="16" width="34" height="20" rx="4" fill="none" stroke="#c9ced4"/>
  <text x="213" y="30" font-family="Arial, sans-serif" font-size="11" fill="#007bc0" text-anchor="middle">Open</text>
  <line x1="12" y1="46" x2="228" y2="46" stroke="#e1e4e8"/>
  <g font-family="Arial, sans-serif" font-size="12">
    <text x="16" y="72" fill="#6a737d">Line-1-CX</text><text x="92" y="72" fill="#00884a" font-weight="bold">TwinCAT RUN · PLC RUN</text>
    <text x="16" y="98" fill="#6a737d">Press-2</text><text x="92" y="98" fill="#00884a" font-weight="bold">TwinCAT RUN</text><text x="180" y="98" fill="#c76b00" font-weight="bold">· STOP</text>
    <text x="16" y="124" fill="#6a737d">Test-IPC</text><text x="92" y="124" fill="#8250df" font-weight="bold">TwinCAT CONFIG</text>
  </g>
</svg>
